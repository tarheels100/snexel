<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snexel — Slither &amp; Chill</title>
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.ico?v=1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=1">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="game">
    <div class="hud">
      <div class="hud-left">
        <span class="p p1">P1&nbsp;<b id="p1score">–</b></span>
        <span class="p p2" id="p2wrap">P2&nbsp;<b id="p2score">–</b></span>
      </div>
      <div class="hud-title">SNEXEL</div>
      <div class="hud-right">BEST&nbsp;<b id="best">0</b></div>
    </div>

    <div class="crt">
      <canvas id="game" width="256" height="192"></canvas>
      <div class="scan"></div>

      <!-- Touch thumb pads (touch-devices only; CSS shows them via media query,
           touch.js wires them). Translucent so snakes under them stay visible.
           Solo: both pads steer P1. Versus: left = P1, right = P2. -->
      <div class="touch-layer">
        <div class="dpad p1">
          <button class="tbtn up"    data-pad="0" data-dir="u" aria-label="Player 1 up">▲</button>
          <button class="tbtn left"  data-pad="0" data-dir="l" aria-label="Player 1 left">◀</button>
          <button class="tbtn right" data-pad="0" data-dir="r" aria-label="Player 1 right">▶</button>
          <button class="tbtn down"  data-pad="0" data-dir="d" aria-label="Player 1 down">▼</button>
        </div>
        <div class="dpad p2">
          <button class="tbtn up"    data-pad="1" data-dir="u" aria-label="Player 2 up">▲</button>
          <button class="tbtn left"  data-pad="1" data-dir="l" aria-label="Player 2 left">◀</button>
          <button class="tbtn right" data-pad="1" data-dir="r" aria-label="Player 2 right">▶</button>
          <button class="tbtn down"  data-pad="1" data-dir="d" aria-label="Player 2 down">▼</button>
        </div>
        <button class="tchip" id="t-pause" data-action="pause" aria-label="Pause">P</button>
        <button class="tchip quit" id="t-quit" data-action="quit" aria-label="Forfeit mini-game">✕</button>
      </div>

      <div class="overlay" id="overlay"></div>
    </div>

    <div class="hint">
      1P: WASD/arrows &nbsp;•&nbsp; 2P: WASD&nbsp;vs&nbsp;arrows &nbsp;•&nbsp; O:&nbsp;options &nbsp;•&nbsp; T:&nbsp;track &nbsp;•&nbsp; P:&nbsp;pause &nbsp;•&nbsp; Esc:&nbsp;menu
    </div>
  </div>
  <script src="src/chiptune-music.js?v=3"></script>
  <script src="src/jaunty-music.js?v=2"></script>
  <script src="src/game.js?v=40"></script>
  <!-- egg/baby pipeline: classic script AFTER game.js (shared global scope, namespace on window.EggBaby) -->
  <script src="src/egg-baby.js?v=4"></script>
  <!-- mini-game engine (M3): own loop + keyboard while active; namespace on window.MiniGame -->
  <script src="src/minigame.js?v=6"></script>
  <script src="src/touch.js?v=1"></script>
</body>
</html>
